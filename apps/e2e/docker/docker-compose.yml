# Docker e2e: smm under test + HTTP forward proxy on one Compose network.
# Driven by ci/e2e-docker-container.ts (Host Runner WDIO → published :30000).
#
# Media host path is injected via SMM_E2E_MEDIA_HOST_DIR (default /tmp/smm).
# Auth via SMM_AUTH_TOKEN (default ChangeMe123).

name: smm-e2e

services:
  http-proxy:
    # Use a locally-cached runtime image + bind-mounted sources so Compose does
    # not need to pull node:* from Docker Hub (often blocked on developer networks).
    # Deps are installed on the host by ci/e2e-docker-container.ts before `up`.
    image: oven/bun:1.3
    container_name: smm-e2e-http-proxy
    working_dir: /app
    command: ['bun', 'server.mjs']
    environment:
      PROXY_HOST: '0.0.0.0'
      PROXY_PORT: '8990'
    volumes:
      - ./http-proxy:/app
    ports:
      - '8990:8990'
    networks:
      - e2e

  smm:
    image: smm:latest
    container_name: smm
    depends_on:
      - http-proxy
    ports:
      - '30000:30000'
      - '30001:30001'
      - '30002:30002'
    extra_hosts:
      # Linux CI / Docker Engine: host config server & host-published ports
      - 'host.docker.internal:host-gateway'
    environment:
      SMM_AUTH_TOKEN: ${SMM_AUTH_TOKEN:-ChangeMe123}
      WEBUI_ADDRESS: '0.0.0.0'
      REVERSE_PROXY_ADDRESS: '0.0.0.0'
      MCP_ADDRESS: '0.0.0.0'
      # Optional; TmdbHostFailover — host runner serves config, container uses host.docker.internal
      EXTERNAL_CONFIG_FILE_URL: ${EXTERNAL_CONFIG_FILE_URL:-}
    volumes:
      - ${SMM_E2E_MEDIA_HOST_DIR:-/tmp/smm}:/media
    networks:
      - e2e

networks:
  e2e:
    driver: bridge
