name: Release Docker

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override semver (optional; default: apps/docker/package.json version)'
        required: false
        type: string
      release_name:
        description: 'Release title (optional)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      body:
        description: 'Release notes (optional)'
        required: false
        type: string
      skip_gates:
        description: 'Skip Verify CI gates (maintainer emergency only)'
        required: false
        default: false
        type: boolean
      skip_final_publish:
        description: 'Orchestration only: build without publishing GitHub Release / final image (set true by Release)'
        required: false
        default: false
        type: boolean
      skip_verify_ci:
        description: 'Orchestration only: skip the in-workflow CI gate check (set true by Release after top-level verify)'
        required: false
        default: false
        type: boolean
      force_rebuild_3pp:
        description: 'Rebuild ffmpeg/ytdlp/videocaptioner images even if their version tag already exists'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag_name:
        description: 'Git tag from orchestrator (e.g. v1.2.3); when set, skip package.json resolve'
        required: false
        type: string
        default: ''
      version_override:
        required: false
        type: string
        default: ''
      release_name:
        required: false
        type: string
        default: ''
      draft:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
      body:
        required: false
        type: string
        default: ''
      skip_gates:
        required: false
        type: boolean
        default: false
      skip_final_publish:
        required: false
        type: boolean
        default: false
      skip_verify_ci:
        required: false
        type: boolean
        default: false
      force_rebuild_3pp:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      git_tag: ${{ steps.resolve.outputs.git_tag }}
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: resolve
        env:
          TAG_NAME: ${{ inputs.tag_name || '' }}
          OVERRIDE: ${{ inputs.version_override || '' }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_NAME}" ]; then
            VERSION="${TAG_NAME#v}"
            {
              echo "version=${VERSION}"
              echo "git_tag=${TAG_NAME}"
              echo "docker_tag=${VERSION}"
            } >> "$GITHUB_OUTPUT"
            echo "Using orchestrator tag_name=${TAG_NAME} (version=${VERSION})"
          elif [ -n "${OVERRIDE}" ]; then
            bun ci/resolve-release-version.ts --product docker --override "${OVERRIDE}" >> "$GITHUB_OUTPUT"
          else
            bun ci/resolve-release-version.ts --product docker >> "$GITHUB_OUTPUT"
          fi

  verify-ci:
    name: Verify CI gates
    needs: resolve-version
    uses: ./.github/workflows/_verify-ci-gates.yml
    with:
      skip: ${{ inputs.skip_verify_ci || inputs.skip_gates }}
    secrets: inherit

  ensure-tag:
    name: Ensure release tag
    needs: [verify-ci, resolve-version]
    uses: ./.github/workflows/_ensure-release-tag.yml
    with:
      tag_name: ${{ needs.resolve-version.outputs.git_tag }}
      target_sha: ${{ github.sha }}
    permissions:
      contents: write

  build-push:
    name: Build and push Docker image
    needs: [verify-ci, ensure-tag, resolve-version]
    uses: ./.github/workflows/_build-docker-push.yml
    with:
      semver_tag: ${{ needs.resolve-version.outputs.docker_tag }}
      push_release_image: ${{ !inputs.skip_final_publish }}
      force_rebuild_3pp: ${{ inputs.force_rebuild_3pp }}
    secrets: inherit

  release-github:
    name: Create or update GitHub Release (Docker)
    needs: [build-push, ensure-tag, resolve-version]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        if: ${{ !inputs.skip_final_publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.git_tag }}
          DOCKER_TAG: ${{ needs.resolve-version.outputs.docker_tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TAG_EXISTS: ${{ needs.ensure-tag.outputs.tag_exists }}
          USER_BODY: ${{ inputs.body }}
          RELEASE_TITLE: ${{ (inputs.release_name != '' && inputs.release_name) || needs.resolve-version.outputs.git_tag }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          DOCKER_SECTION="$(printf '%s\n' \
            '## Docker' \
            '' \
            '```bash' \
            "docker pull lawrenceching/smm:${DOCKER_TAG}" \
            '```' \
            '' \
            "Multi-arch (\`linux/amd64\`, \`linux/arm64\`). See [docker-install.md](https://github.com/${REPO}/blob/${TAG}/docs/docker-install.md).")"

          write_notes() {
            printf '%s' "$1" > /tmp/release-notes.md
          }

          if [ "${TAG_EXISTS}" = "true" ]; then
            EXISTING="$(gh release view "${TAG}" --repo "${REPO}" --json body -q .body || true)"
            if printf '%s' "${EXISTING}" | grep -q '## Docker'; then
              echo "Docker section already present in Release ${TAG}."
            else
              if [ -n "${EXISTING}" ]; then
                NOTES="$(printf '%s\n\n%s' "${EXISTING}" "${DOCKER_SECTION}")"
              else
                NOTES="${DOCKER_SECTION}"
              fi
              write_notes "${NOTES}"
              gh release edit "${TAG}" --repo "${REPO}" --notes-file /tmp/release-notes.md
              echo "Appended Docker section to existing Release ${TAG}."
            fi
          else
            if [ -n "${USER_BODY}" ]; then
              NOTES="$(printf '%s\n\n%s' "${USER_BODY}" "${DOCKER_SECTION}")"
            else
              NOTES="${DOCKER_SECTION}"
            fi
            write_notes "${NOTES}"
            args=(
              gh release create "${TAG}"
              --repo "${REPO}"
              --target "${SHA}"
              --title "${RELEASE_TITLE}"
              --notes-file /tmp/release-notes.md
            )
            if [ "${IS_DRAFT}" = "true" ]; then
              args+=(--draft)
            fi
            if [ "${IS_PRERELEASE}" = "true" ]; then
              args+=(--prerelease)
            fi
            "${args[@]}"
            echo "Created GitHub Release ${TAG} with Docker notes."
          fi

  audit-skips:
    name: Audit skip options
    needs: verify-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record skip options in summary
        run: |
          {
            echo "## Release Docker skip audit"
            if [ "${{ inputs.skip_gates }}" = "true" ]; then
              echo "::warning::skip_gates was enabled for this run."
              echo "- **skip_gates**: enabled"
            else
              echo "- **skip_gates**: disabled"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
