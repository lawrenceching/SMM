name: Release Docker

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag for the release (e.g. v1.2.3)'
        required: true
        type: string
      release_name:
        description: 'Release title (optional)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      body:
        description: 'Release notes (optional)'
        required: false
        type: string
      skip_ci_verification:
        description: 'Skip CI gate verification (maintainer emergency only)'
        required: false
        default: false
        type: boolean
      skip_final_publish:
        description: 'Orchestration only: build without publishing GitHub Release / final image (set true by Release)'
        required: false
        default: false
        type: boolean
      skip_verify_ci:
        description: 'Orchestration only: skip the in-workflow CI gate check (set true by Release after top-level verify)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      release_name:
        required: false
        type: string
        default: ''
      draft:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
      body:
        required: false
        type: string
        default: ''
      skip_ci_verification:
        required: false
        type: boolean
        default: false
      skip_final_publish:
        required: false
        type: boolean
        default: false
      skip_verify_ci:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  verify-ci:
    name: Verify CI gates
    uses: ./.github/workflows/_verify-ci-gates.yml
    with:
      skip: ${{ inputs.skip_verify_ci || inputs.skip_ci_verification }}
    secrets: inherit

  ensure-tag:
    name: Ensure release tag
    needs: verify-ci
    uses: ./.github/workflows/_ensure-release-tag.yml
    with:
      tag_name: ${{ inputs.tag_name }}
      target_sha: ${{ github.sha }}
    permissions:
      contents: write

  build-push:
    name: Build and push Docker image
    needs: [verify-ci, ensure-tag]
    uses: ./.github/workflows/_build-docker-push.yml
    with:
      semver_tag: ${{ inputs.tag_name }}
      push_release_image: ${{ !inputs.skip_final_publish }}
    secrets: inherit

  release-github:
    name: Create or update GitHub Release (Docker)
    needs: [build-push, ensure-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        if: ${{ !inputs.skip_final_publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TAG_EXISTS: ${{ needs.ensure-tag.outputs.tag_exists }}
          USER_BODY: ${{ inputs.body }}
          RELEASE_TITLE: ${{ (inputs.release_name != '' && inputs.release_name) || inputs.tag_name }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          DOCKER_SECTION="$(printf '%s\n' \
            '## Docker' \
            '' \
            '```bash' \
            "docker pull lawrenceching/smm:${TAG}" \
            '```' \
            '' \
            "Multi-arch (\`linux/amd64\`, \`linux/arm64\`). See [docker-install.md](https://github.com/${REPO}/blob/${TAG}/docs/docker-install.md).")"

          write_notes() {
            printf '%s' "$1" > /tmp/release-notes.md
          }

          if [ "${TAG_EXISTS}" = "true" ]; then
            EXISTING="$(gh release view "${TAG}" --repo "${REPO}" --json body -q .body || true)"
            if printf '%s' "${EXISTING}" | grep -q '## Docker'; then
              echo "Docker section already present in Release ${TAG}."
            else
              if [ -n "${EXISTING}" ]; then
                NOTES="$(printf '%s\n\n%s' "${EXISTING}" "${DOCKER_SECTION}")"
              else
                NOTES="${DOCKER_SECTION}"
              fi
              write_notes "${NOTES}"
              gh release edit "${TAG}" --repo "${REPO}" --notes-file /tmp/release-notes.md
              echo "Appended Docker section to existing Release ${TAG}."
            fi
          else
            if [ -n "${USER_BODY}" ]; then
              NOTES="$(printf '%s\n\n%s' "${USER_BODY}" "${DOCKER_SECTION}")"
            else
              NOTES="${DOCKER_SECTION}"
            fi
            write_notes "${NOTES}"
            args=(
              gh release create "${TAG}"
              --repo "${REPO}"
              --target "${SHA}"
              --title "${RELEASE_TITLE}"
              --notes-file /tmp/release-notes.md
            )
            if [ "${IS_DRAFT}" = "true" ]; then
              args+=(--draft)
            fi
            if [ "${IS_PRERELEASE}" = "true" ]; then
              args+=(--prerelease)
            fi
            "${args[@]}"
            echo "Created GitHub Release ${TAG} with Docker notes."
          fi

  audit-skips:
    name: Audit skip options
    needs: verify-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record skip options in summary
        run: |
          {
            echo "## Release Docker skip audit"
            if [ "${{ inputs.skip_ci_verification }}" = "true" ]; then
              echo "::warning::skip_ci_verification was enabled for this run."
              echo "- **skip_ci_verification**: enabled"
            else
              echo "- **skip_ci_verification**: disabled"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
