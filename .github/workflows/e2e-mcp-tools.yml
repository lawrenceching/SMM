name: E2E Tests for MCP Tools

# Manual-only MCP bun:test e2e (apps/e2e/mcp) against a freshly built
# apps/cli/dist/cli[.exe]. Starts MCP via `cli mcp start` inside tests and
# asserts tools/list via @modelcontextprotocol/inspector.
# Same five OS/arch runners as "E2E Tests for Electron" / "E2E Tests for CLI".
# Not a CI or release gate.

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional bun test path under apps/e2e/mcp (e.g. ./mcp/tools-list.test.ts). Empty runs all MCP e2e tests.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated platform-arch keys to run (win-x64,win-arm64,linux-x64,linux-arm64,mac-arm64). Empty = all.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests for MCP Tools (${{ matrix.platform }}-${{ matrix.arch }})
    if: ${{ inputs.platforms == '' || contains(format(',{0},', inputs.platforms), format(',{0}-{1},', matrix.platform, matrix.arch)) || contains(format(',{0},', inputs.platforms), format(', {0}-{1},', matrix.platform, matrix.arch)) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runs-on: windows-latest
          - platform: win
            arch: arm64
            runs-on: windows-11-arm
          - platform: linux
            arch: x64
            runs-on: ubuntu-latest
          - platform: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - platform: mac
            arch: arm64
            runs-on: macos-14

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter cli run build

      - name: Run MCP Tools E2E tests
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.test_filter }}" ]; then
            bun ci/run-mcp-e2e-test.ts "${{ inputs.test_filter }}"
          else
            bun ci/run-mcp-e2e-test.ts
          fi

  gate:
    name: mcp-tools-e2e / gate
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected MCP Tools E2E matrix jobs passed
        run: |
          set -euo pipefail
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::mcp-tools e2e matrix: ${{ needs.e2e.result }}"
            exit 1
          fi
          echo "MCP Tools E2E matrix passed."
