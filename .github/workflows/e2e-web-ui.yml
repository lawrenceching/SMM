name: E2E Tests for Web UI

# Manual-only e2e against Web UI (apps/ui + apps/cli as HTTP server).
# Runs common/* suites via bun ci/run-e2e-test.ts (default --platform desktop).
# AI tool and MCP tool suites have their own workflows (placeholders for now).
# No unit tests, and not a CI or release gate.
#
# For host e2e in PR CI, use the CI workflow. For Electron, use "E2E Tests for Electron".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMM_AUTH_TOKEN: ChangeMe123
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run Config and HTTP Proxy Tests
            # Proxy-through-custom-host specs live under common/config (*WithHttpProxy).
            spec: "./common/config/*.e2e.ts"
            artifact_prefix: config-httpproxy
          - name: Run Common Media Init Tests
            spec: "./common/tv/ImportTvShowLibrary.e2e.ts ./common/tv/Initialize*.e2e.ts ./common/movie/ImportMovieLibrary.e2e.ts ./common/movie/Initialize*.e2e.ts"
            artifact_prefix: media-folder-initialization
          - name: Run Movie Tests
            spec: "./common/movie/SearchMovie.e2e.ts ./common/movie/Movie-RenameVideoFile.e2e.ts"
            artifact_prefix: movie
          - name: Run Music Tests
            spec: "./common/music/*.e2e.ts"
            artifact_prefix: music
          - name: Run Other Tests
            spec: "./common/other/*.e2e.ts"
            artifact_prefix: other
          - name: Run TV Show Tests
            spec: "./common/tv/SearchTvShow.e2e.ts ./common/tv/Scrape*.e2e.ts ./common/tv/TVShow-*.e2e.ts"
            artifact_prefix: tv
          - name: Run TVDB Tests
            spec: "./common/tvdb/*.e2e.ts"
            artifact_prefix: tvdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Require API key secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::Secret TMDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${TVDB_API_KEY:-}" ]; then
            echo "::error::Secret TVDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          exit "$missing"

      - name: Build CLI
        run: cd apps/cli && pnpm run build

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '146.0.7680.153'
          install-dependencies: true
          install-chromedriver: true

      - name: Run E2E tests
        id: e2e
        run: |
          args=()
          for pattern in ${{ matrix.spec }}; do
            args+=(--spec "$pattern")
          done
          # Web UI = default desktop platform (cli HTTP server + Vite UI + Chrome).
          bun ci/run-e2e-test.ts --platform desktop "${args[@]}"
        env:
          BUILD_ENV: docker
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Scan e2e logs for secret leaks
        id: scan-secure
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload E2E logs and reports
        if: always() && steps.e2e.outcome != 'skipped' && steps.scan-secure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-${{ matrix.artifact_prefix }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7
