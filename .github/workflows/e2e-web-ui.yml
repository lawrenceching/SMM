name: E2E Tests for Web UI

# Manual-only e2e against Web UI (apps/ui + apps/cli as HTTP server).
# Same five OS/arch runners as "E2E Tests for Electron".
# Runs apps/e2e/common suites via bun ci/run-e2e-test.ts --platform desktop.
# common/manual stays on-demand. AI tool and MCP tool suites have their own workflows.
# No unit tests, and not a CI or release gate.
#
# Chrome on win-arm64: Chrome for Testing has no win-arm64 builds, so that matrix
# entry uses the Google Chrome preinstalled on windows-11-arm (scheme A).

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platform-arch to run (empty = all). Example: win-x64'
        required: false
        default: ''
        type: string
      specs:
        description: 'Single spec glob passed to run-e2e-test (empty = all common suites). Example: ./common/movie/*.e2e.ts'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: Build matrix
        id: set
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 << 'PY'
          import json, os
          rows = [
              {"platform": "win", "arch": "x64", "runs-on": "windows-latest", "chrome-source": "cft", "chrome-version": "146.0.7680.153"},
              # Chrome for Testing has no win-arm64 build; use the runner's Chrome.
              {"platform": "win", "arch": "arm64", "runs-on": "windows-11-arm", "chrome-source": "runner", "chrome-version": ""},
              {"platform": "linux", "arch": "x64", "runs-on": "ubuntu-latest", "chrome-source": "cft", "chrome-version": "146.0.7680.153"},
              # 146.0.7680.153 has no linux-arm64 Chrome-for-Testing artifact.
              {"platform": "linux", "arch": "arm64", "runs-on": "ubuntu-24.04-arm", "chrome-source": "cft", "chrome-version": "153.0.8010.52"},
              {"platform": "mac", "arch": "arm64", "runs-on": "macos-14", "chrome-source": "cft", "chrome-version": "146.0.7680.153"},
          ]
          wanted = {part.strip() for part in os.environ.get("PLATFORMS", "").split(",") if part.strip()}
          if wanted:
              rows = [row for row in rows if f"{row['platform']}-{row['arch']}" in wanted]
          if not rows:
              raise SystemExit(f"no platforms matched: {os.environ.get('PLATFORMS', '')}")
          payload = json.dumps(rows)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("include<<EOF\n")
              handle.write(payload)
              handle.write("\nEOF\n")
          print(payload)
          PY

  e2e:
    name: E2E Tests for Web UI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: select
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select.outputs.include) }}

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SMM_AUTH_TOKEN: ChangeMe123
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Require API key secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::Secret TMDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${TVDB_API_KEY:-}" ]; then
            echo "::error::Secret TVDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          exit "$missing"

      - name: Install CJK fonts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Chrome (Chrome for Testing)
        id: setup-chrome
        if: matrix.chrome-source == 'cft'
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome-version }}
          # install-dependencies is Linux-only in setup-chrome; keep true for apt deps.
          install-dependencies: true
          install-chromedriver: true

      - name: Use runner Chrome (Windows ARM64)
        id: runner-chrome
        if: matrix.chrome-source == 'runner'
        run: |
          set -euo pipefail
          # windows-11-arm ships Google Chrome (ARM64). Chrome for Testing does not.
          chrome='C:/Program Files/Google/Chrome/Application/chrome.exe'
          if [ ! -f "${chrome}" ]; then
            echo "::error::Preinstalled Google Chrome not found at ${chrome}"
            ls -la 'C:/Program Files/Google/Chrome/Application/' 2>/dev/null || true
            exit 1
          fi
          ver="$(powershell.exe -NoProfile -Command "(Get-Item -LiteralPath '${chrome}').VersionInfo.ProductVersion" | tr -d '\r')"
          echo "Using runner Chrome ${ver}"
          echo "chrome-path=${chrome}" >> "${GITHUB_OUTPUT}"
          # Leave chromedriver unset: WDIO/Selenium Manager resolves a driver
          # matching this Chrome (CfT has no win-arm64 chromedriver package).

      - name: Run Web UI e2e
        id: e2e
        run: |
          set -euo pipefail
          # Same common suites as Electron e2e, on the desktop (Web UI) platform.
          # MCP and AI tool suites stay in their own workflows.
          # E2E_SPECS limits the run to one glob when set from workflow_dispatch.
          if [ -n "${E2E_SPECS}" ]; then
            bun ci/run-e2e-test.ts --platform desktop --spec "${E2E_SPECS}"
          else
            bun ci/run-e2e-test.ts --platform desktop --spec "./common/config/*.e2e.ts"
            bun ci/run-e2e-test.ts --platform desktop --spec "./common/movie/*.e2e.ts"
            bun ci/run-e2e-test.ts --platform desktop --spec "./common/music/*.e2e.ts"
            bun ci/run-e2e-test.ts --platform desktop --spec "./common/other/*.e2e.ts"
            bun ci/run-e2e-test.ts --platform desktop --spec "./common/tv/*.e2e.ts"
            bun ci/run-e2e-test.ts --platform desktop --spec "./common/tvdb/*.e2e.ts"
          fi
        env:
          BUILD_ENV: docker
          E2E_SPECS: ${{ inputs.specs }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path || steps.runner-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Scan e2e logs for secret leaks
        id: scan-secure
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload logs
        if: always() && steps.e2e.outcome != 'skipped' && steps.scan-secure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-${{ matrix.platform }}-${{ matrix.arch }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7
