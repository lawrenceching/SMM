name: E2E Tests for Web UI

# Manual-only e2e against built Web UI (CLI serves static UI from apps/ui build).
# Same five OS/arch runners as "E2E Tests for Electron".
# Builds cli+ui, then runs apps/e2e/common suites via bun ci/run-e2e-test.ts --platform web.
# Not Vite dev server. common/manual stays on-demand. AI tool and MCP tool suites have their own workflows.
# No unit tests, and not a CI or release gate.
#
# Chrome on win-arm64: Chrome for Testing has no win-arm64 builds, so that matrix
# entry uses the Google Chrome preinstalled on windows-11-arm (scheme A).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests for Web UI (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runs-on: windows-latest
            chrome-source: cft
            chrome-version: '146.0.7680.153'
          - platform: win
            arch: arm64
            runs-on: windows-11-arm
            # CfT/setup-chrome cannot install a pinned Chrome on Windows ARM64.
            chrome-source: runner
            chrome-version: ''
          - platform: linux
            arch: x64
            runs-on: ubuntu-latest
            chrome-source: cft
            chrome-version: '146.0.7680.153'
          - platform: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
            chrome-source: cft
            # 146.0.7680.153 has no linux-arm64 Chrome-for-Testing artifact.
            chrome-version: '153.0.8010.52'
          - platform: mac
            arch: arm64
            runs-on: macos-14
            chrome-source: cft
            chrome-version: '146.0.7680.153'

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SMM_AUTH_TOKEN: ChangeMe123
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Require API key secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::Secret TMDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${TVDB_API_KEY:-}" ]; then
            echo "::error::Secret TVDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          exit "$missing"

      - name: Install CJK fonts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Chrome (Chrome for Testing)
        id: setup-chrome
        if: matrix.chrome-source == 'cft'
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome-version }}
          # install-dependencies is Linux-only in setup-chrome; keep true for apt deps.
          install-dependencies: true
          install-chromedriver: true

      - name: Use runner Chrome (Windows ARM64)
        id: runner-chrome
        if: matrix.chrome-source == 'runner'
        run: |
          set -euo pipefail
          # windows-11-arm ships Google Chrome (ARM64). Chrome for Testing does not.
          chrome='C:/Program Files/Google/Chrome/Application/chrome.exe'
          if [ ! -f "${chrome}" ]; then
            echo "::error::Preinstalled Google Chrome not found at ${chrome}"
            ls -la 'C:/Program Files/Google/Chrome/Application/' 2>/dev/null || true
            exit 1
          fi
          ver="$(powershell.exe -NoProfile -Command "(Get-Item -LiteralPath '${chrome}').VersionInfo.ProductVersion" | tr -d '\r')"
          echo "Using runner Chrome ${ver}"
          echo "chrome-path=${chrome}" >> "${GITHUB_OUTPUT}"
          # Leave chromedriver unset: WDIO/Selenium Manager resolves a driver
          # matching this Chrome (CfT has no win-arm64 chromedriver package).

      - name: Build CLI
        run: pnpm --filter cli run build

      - name: Build UI
        run: pnpm --filter ui run build

      - name: Run Web UI e2e
        id: e2e
        run: |
          set -euo pipefail
          bun ci/run-e2e-test.ts --platform web --spec "./common/config/*.e2e.ts"
          bun ci/run-e2e-test.ts --platform web --spec "./common/movie/*.e2e.ts"
          bun ci/run-e2e-test.ts --platform web --spec "./common/music/*.e2e.ts"
          bun ci/run-e2e-test.ts --platform web --spec "./common/other/*.e2e.ts"
          bun ci/run-e2e-test.ts --platform web --spec "./common/tv/*.e2e.ts"
          bun ci/run-e2e-test.ts --platform web --spec "./common/tvdb/*.e2e.ts"
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path || steps.runner-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Scan e2e logs for secret leaks
        id: scan-secure
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload logs
        if: always() && steps.e2e.outcome != 'skipped' && steps.scan-secure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-${{ matrix.platform }}-${{ matrix.arch }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7
