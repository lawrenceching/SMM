name: Ensure release tag (reusable)

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Git tag (e.g. v1.2.3)'
        required: true
        type: string
      target_sha:
        description: 'Commit SHA the tag should point to when created'
        required: true
        type: string
    outputs:
      tag_exists:
        description: 'true if the tag already existed before this job ran'
        value: ${{ jobs.ensure-tag.outputs.tag_exists }}

jobs:
  ensure-tag:
    name: Ensure release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_exists: ${{ steps.check.outputs.tag_exists }}
    steps:
      - name: Check whether tag exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag_name }}'
          REPO='${{ github.repository }}'
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists on remote; skip creating."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist; will create at ${{ inputs.target_sha }}."
          fi

      - name: Create annotated tag
        if: steps.check.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag_name }}'
          SHA='${{ inputs.target_sha }}'
          REPO='${{ github.repository }}'
          # gh has no `tag` subcommand; create the tag via the Git Data API.
          # A sibling release workflow may create the tag between the check
          # step and here (Release runs Electron + Docker sub-workflows in parallel).
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} was created concurrently; nothing to do."
            exit 0
          fi
          # 1) Create an annotated tag object pointing at the commit.
          TAG_OBJ_SHA=$(gh api --method POST "repos/${REPO}/git/tags" \
            -f tag="${TAG}" \
            -f message="Release ${TAG}" \
            -f object="${SHA}" \
            -f type=commit \
            --jq '.sha')
          # 2) Create the ref that names the tag. It may already exist if a
          #    sibling workflow created it concurrently (409); then verify it.
          if ! gh api --method POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_OBJ_SHA}" >/dev/null 2>&1; then
            gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null
          fi
          echo "Annotated tag ${TAG} now exists at ${SHA}."
