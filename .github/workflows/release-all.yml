name: Release

# Orchestrates Electron + Docker release workflows in parallel (same commit / tag).
# Both sub-workflows run build-only; a single publish job pushes the Docker image
# and publishes the GitHub Release only after every build has succeeded.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag for the release (e.g. v1.2.3)'
        required: true
        type: string
      release_name:
        description: 'Release title (optional)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      body:
        description: 'Release notes (optional)'
        required: false
        type: string
      skip_ci_verification:
        description: 'Skip CI gate verification for both products (maintainer emergency only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  verify-ci:
    name: Verify CI gates
    uses: ./.github/workflows/_verify-ci-gates.yml
    with:
      skip: ${{ inputs.skip_ci_verification }}
    secrets: inherit

  release-electron:
    name: Release Electron
    needs: verify-ci
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ inputs.tag_name }}
      release_name: ${{ inputs.release_name }}
      draft: ${{ inputs.draft }}
      prerelease: ${{ inputs.prerelease }}
      body: ${{ inputs.body }}
      skip_ci_verification: ${{ inputs.skip_ci_verification }}
      skip_verify_ci: true
      skip_final_publish: true
    secrets: inherit

  release-docker:
    name: Release Docker
    needs: verify-ci
    uses: ./.github/workflows/release-docker.yml
    with:
      tag_name: ${{ inputs.tag_name }}
      release_name: ${{ inputs.release_name }}
      draft: ${{ inputs.draft }}
      prerelease: ${{ inputs.prerelease }}
      body: ${{ inputs.body }}
      skip_ci_verification: ${{ inputs.skip_ci_verification }}
      skip_verify_ci: true
      skip_final_publish: true
    secrets: inherit

  publish:
    name: Publish release
    needs: [release-electron, release-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image coordinates
        id: meta
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHA='${{ github.sha }}'
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "cli_image=ghcr.io/${OWNER_LC}/smm-cli-build:${SHA}" >> "$GITHUB_OUTPUT"
          echo "ui_image=ghcr.io/${OWNER_LC}/smm-ui-build:${SHA}" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_image=ghcr.io/${OWNER_LC}/smm-ffmpeg:${SHA}" >> "$GITHUB_OUTPUT"
          echo "ytdlp_image=ghcr.io/${OWNER_LC}/smm-ytdlp:${SHA}" >> "$GITHUB_OUTPUT"
          echo "videocaptioner_image=ghcr.io/${OWNER_LC}/smm-videocaptioner:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push lawrenceching/smm
        env:
          PLATFORMS: linux/amd64,linux/arm64
          SEMVER_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tags=(
            -t "lawrenceching/smm:latest"
            -t "lawrenceching/smm:${{ steps.meta.outputs.sha }}"
          )
          if [ -n "${SEMVER_TAG}" ]; then
            tags+=( -t "lawrenceching/smm:${SEMVER_TAG}" )
          fi
          docker buildx build --platform "$PLATFORMS" --push \
            --build-arg "SMM_CLI_IMAGE=${{ steps.meta.outputs.cli_image }}" \
            --build-arg "SMM_UI_IMAGE=${{ steps.meta.outputs.ui_image }}" \
            --build-arg "SMM_FFMPEG_IMAGE=${{ steps.meta.outputs.ffmpeg_image }}" \
            --build-arg "SMM_YTDLP_IMAGE=${{ steps.meta.outputs.ytdlp_image }}" \
            --build-arg "SMM_VIDEOCAPTIONER_IMAGE=${{ steps.meta.outputs.videocaptioner_image }}" \
            "${tags[@]}" \
            -f apps/docker/Dockerfile .

      - name: Download Electron artifacts (all platforms)
        uses: actions/download-artifact@v4
        with:
          pattern: smm-v*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
          REPO: ${{ github.repository }}
          USER_BODY: ${{ inputs.body }}
          RELEASE_TITLE: ${{ (inputs.release_name != '' && inputs.release_name) || inputs.tag_name }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(dist/**/*)

          DOCKER_SECTION="$(printf '%s\n' \
            '## Docker' \
            '' \
            '```bash' \
            "docker pull lawrenceching/smm:${TAG}" \
            '```' \
            '' \
            "Multi-arch (\`linux/amd64\`, \`linux/arm64\`). See [docker-install.md](https://github.com/${REPO}/blob/${TAG}/docs/docker-install.md).")"

          write_notes() { printf '%s' "$1" > /tmp/release-notes.md; }

          if gh release view "${TAG}" --repo "${REPO}" --json body -q .body >/tmp/existing.md 2>/dev/null; then
            EXISTING="$(cat /tmp/existing.md)"
            if printf '%s' "${EXISTING}" | grep -q '## Docker'; then
              NOTES="${EXISTING}"
            else
              NOTES="$(printf '%s\n\n%s' "${EXISTING}" "${DOCKER_SECTION}")"
            fi
            write_notes "${NOTES}"
            gh release edit "${TAG}" --repo "${REPO}" --notes-file /tmp/release-notes.md
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "${TAG}" --repo "${REPO}" "${files[@]}" --clobber
            fi
            echo "Updated existing Release ${TAG} with Docker section + Electron assets."
          else
            NOTES="$(if [ -n "${USER_BODY}" ]; then printf '%s\n\n%s' "${USER_BODY}" "${DOCKER_SECTION}"; else printf '%s' "${DOCKER_SECTION}"; fi)"
            write_notes "${NOTES}"
            args=(
              gh release create "${TAG}"
              --repo "${REPO}"
              --title "${RELEASE_TITLE}"
              --notes-file /tmp/release-notes.md
            )
            if [ ${#files[@]} -gt 0 ]; then
              args+=( "${files[@]}" )
            fi
            if [ "${IS_DRAFT}" = "true" ]; then args+=(--draft); fi
            if [ "${IS_PRERELEASE}" = "true" ]; then args+=(--prerelease); fi
            "${args[@]}"
            echo "Created GitHub Release ${TAG} with Electron assets + Docker notes."
          fi

  summary:
    name: Release summary
    needs: [release-electron, release-docker, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "| Product | Result |"
            echo "|---------|--------|"
            echo "| Electron | ${{ needs.release-electron.result }} |"
            echo "| Docker | ${{ needs.release-docker.result }} |"
            echo "| Publish | ${{ needs.publish.result }} |"
            echo ""
            echo "**Tag:** \`${TAG}\`"
            echo "**Commit:** \`${SHA}\`"
            if [ "${SKIP_CI}" = "true" ]; then
              echo ""
              echo "::warning::skip_ci_verification was enabled for this run."
              echo "- **skip_ci_verification**: enabled"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ inputs.tag_name }}
          SHA: ${{ github.sha }}
          SKIP_CI: ${{ inputs.skip_ci_verification }}
