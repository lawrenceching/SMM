name: E2E Tests for AI Tools

# Placeholder. Same five OS/arch runners as "E2E Tests for Electron".
# No test steps yet. See docs/dev/supported-platform.md (AI tool).
# Manual-only; not a CI or release gate.

run-name: "E2E AI Tools «parent:${{ inputs.parent_run_id || 'manual' }}»"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platform-arch keys to run (win-x64,win-arm64,linux-x64,linux-arm64,mac-arm64). Empty = all.'
        required: false
        type: string
        default: ''
      parent_run_id:
        description: 'Parent Actions run id when dispatched by an orchestrator (reuse correlation)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.filter.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter platforms
        id: filter
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          include="$(
            python ci/filter-platform-matrix.py <<'EOF'
          [
            {"platform":"win","arch":"x64","runs-on":"windows-latest"},
            {"platform":"win","arch":"arm64","runs-on":"windows-11-arm"},
            {"platform":"linux","arch":"x64","runs-on":"ubuntu-latest"},
            {"platform":"linux","arch":"arm64","runs-on":"ubuntu-24.04-arm"},
            {"platform":"mac","arch":"arm64","runs-on":"macos-14"}
          ]
          EOF
          )"
          {
            echo "include<<EOF"
            echo "${include}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved matrix: ${include}"

  e2e:
    name: E2E Tests for AI Tools (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [resolve-matrix]
    if: ${{ needs.resolve-matrix.outputs.include != '[]' }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}

    steps:
      - name: Placeholder
        run: echo "E2E Tests for AI Tools (${{ matrix.platform }}-${{ matrix.arch }}) is not implemented yet."
