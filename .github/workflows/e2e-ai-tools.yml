name: E2E Tests for AI Tools

# Placeholder. Same five OS/arch runners as "E2E Tests for Electron".
# No test steps yet. See docs/dev/supported-platform.md (AI tool).
# Manual-only; not a CI or release gate.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platform-arch keys to run (win-x64,win-arm64,linux-x64,linux-arm64,mac-arm64). Empty = all.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests for AI Tools (${{ matrix.platform }}-${{ matrix.arch }})
    if: ${{ inputs.platforms == '' || contains(format(',{0},', inputs.platforms), format(',{0}-{1},', matrix.platform, matrix.arch)) || contains(format(',{0},', inputs.platforms), format(', {0}-{1},', matrix.platform, matrix.arch)) }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runs-on: windows-latest
          - platform: win
            arch: arm64
            runs-on: windows-11-arm
          - platform: linux
            arch: x64
            runs-on: ubuntu-latest
          - platform: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - platform: mac
            arch: arm64
            runs-on: macos-14

    steps:
      - name: Placeholder
        run: echo "E2E Tests for AI Tools (${{ matrix.platform }}-${{ matrix.arch }}) is not implemented yet."
