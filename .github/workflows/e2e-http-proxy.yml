name: E2E HTTP Proxy (Multi-Platform)

on:
  workflow_dispatch:

jobs:
  e2e-http-proxy:
    name: HTTP Proxy (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runs-on: ubuntu-latest
          - platform: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - platform: win
            arch: x64
            runs-on: windows-latest
          - platform: win
            arch: arm64
            runs-on: windows-11-arm
          - platform: mac
            arch: arm64
            runs-on: macos-14

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Run reverse-proxy HTTP Proxy tests
        id: e2e
        run: pnpm e2e:http-proxy

      - name: Scan e2e logs for secret leaks
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload logs
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: http-proxy-${{ matrix.platform }}-${{ matrix.arch }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7
