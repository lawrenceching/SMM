name: CI

# Orchestrates multi-platform Build (win-x64) then parallel Web UI + MCP Tools
# E2E (win-x64), and keeps Docker / HTTP Proxy E2E in this workflow.
#
# Required check names (RELEASE_REQUIRED_CHECKS) must stay stable — see
# ci/verify-check-runs-lib.ts:
#   Lint UI, build / gate, web-ui-e2e / gate, mcp-tools-e2e / gate,
#   docker-e2e / gate, http-proxy-e2e / gate
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'ci/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'knip.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/e2e-web-ui.yml'
      - '.github/workflows/e2e-mcp-tools.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'ci/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'knip.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/e2e-web-ui.yml'
      - '.github/workflows/e2e-mcp-tools.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint UI
        run: cd apps/ui && pnpm run lint

  dispatch-build:
    name: Dispatch Build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch Build (win-x64) and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          DISPATCH_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          bash ci/dispatch-and-wait-workflow.sh build.yml \
            "${DISPATCH_REF}" "${DISPATCH_SHA}" \
            -f platforms=win-x64

  dispatch-e2e-web-ui:
    name: Dispatch E2E Tests for Web UI
    needs: [dispatch-build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch Web UI E2E (win-x64) and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          DISPATCH_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          bash ci/dispatch-and-wait-workflow.sh e2e-web-ui.yml \
            "${DISPATCH_REF}" "${DISPATCH_SHA}" \
            -f platforms=win-x64

  dispatch-e2e-mcp-tools:
    name: Dispatch E2E Tests for MCP Tools
    needs: [dispatch-build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch MCP Tools E2E (win-x64) and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          DISPATCH_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          bash ci/dispatch-and-wait-workflow.sh e2e-mcp-tools.yml \
            "${DISPATCH_REF}" "${DISPATCH_SHA}" \
            -f platforms=win-x64

  # ------------------------------------------------------------------
  # Docker E2E (was e2e-docker.yml)
  # ------------------------------------------------------------------
  build-image:
    name: Build smm:latest (amd64)
    needs: [dispatch-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # docker driver shares the host image store so assemble can FROM
      # locally --load'ed intermediate tags (smm-cli-build, etc.).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build intermediate Docker images (amd64)
        run: |
          set -euo pipefail
          PLATFORM=linux/amd64
          docker buildx build --load --platform "$PLATFORM" \
            -t smm-cli-build:latest -f apps/docker/cli.Dockerfile .
          docker buildx build --load --platform "$PLATFORM" \
            -t smm-ui-build:latest -f apps/docker/ui.Dockerfile .
          docker buildx build --load --platform "$PLATFORM" \
            -t smm-ffmpeg:latest -f apps/docker/ffmpeg.Dockerfile .
          docker buildx build --load --platform "$PLATFORM" \
            -t smm-ytdlp:latest -f apps/docker/ytdlp.Dockerfile .
          docker buildx build --load --platform "$PLATFORM" \
            -t smm-videocaptioner:latest -f apps/docker/videocaptioner.Dockerfile .

      - name: Assemble smm:latest
        run: |
          docker buildx build --load --platform linux/amd64 \
            -t smm:latest -f apps/docker/Dockerfile .

      - name: Export smm:latest
        run: docker save smm:latest | gzip > smm-latest.tar.gz

      - name: Upload smm:latest image
        uses: actions/upload-artifact@v4
        with:
          name: smm-latest-amd64
          path: smm-latest.tar.gz
          retention-days: 2

  e2e-docker:
    name: ${{ matrix.name }}
    needs: [build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SMM_AUTH_TOKEN: ChangeMe123
      TMDB_HTTP_PROXY: http://http-proxy:8990
      TVDB_HTTP_PROXY: http://http-proxy:8990
      E2E_HTTP_PROXY_PROBE_URL: http://127.0.0.1:8990
      E2E_DOCKER_UI_ORIGIN: http://localhost:30000/
      # Config server runs on the host; smm container reaches it via host.docker.internal
      EXTERNAL_CONFIG_FILE_URL: http://host.docker.internal:8000/config.json
      # Repository Actions secrets (Settings → Secrets and variables → Actions)
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      # Optional overrides; omit secrets to use app/test defaults
      TMDB_HOST: ${{ secrets.TMDB_HOST }}
      TVDB_HOST: ${{ secrets.TVDB_HOST }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Docker E2E (config)
            # Includes *WithHttpProxy specs (former common/httpproxy suite).
            spec: "./common/config/*.e2e.ts"
            artifact_prefix: docker-config
          - name: Docker E2E (mcp)
            spec: "./common/mcp/*.e2e.ts"
            artifact_prefix: docker-mcp
          - name: Docker E2E (media-init)
            spec: "./common/tv/ImportTvShowLibrary.e2e.ts ./common/tv/Initialize*.e2e.ts ./common/movie/ImportMovieLibrary.e2e.ts ./common/movie/Initialize*.e2e.ts"
            artifact_prefix: docker-media-init
          - name: Docker E2E (movie)
            spec: "./common/movie/SearchMovie.e2e.ts ./common/movie/Movie-RenameVideoFile.e2e.ts"
            artifact_prefix: docker-movie
          - name: Docker E2E (music)
            spec: "./common/music/*.e2e.ts"
            artifact_prefix: docker-music
          - name: Docker E2E (other)
            spec: "./common/other/*.e2e.ts"
            artifact_prefix: docker-other
          - name: Docker E2E (tv)
            spec: "./common/tv/SearchTvShow.e2e.ts ./common/tv/Scrape*.e2e.ts ./common/tv/TVShow-*.e2e.ts ./common/tv/TmdbHostFailover.e2e.ts"
            artifact_prefix: docker-tv
          - name: Docker E2E (tvdb)
            spec: "./common/tvdb/*.e2e.ts"
            artifact_prefix: docker-tvdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '146.0.7680.153'
          install-dependencies: true
          install-chromedriver: true

      - name: Download smm:latest image
        uses: actions/download-artifact@v4
        with:
          name: smm-latest-amd64
          path: .

      - name: Load smm:latest
        run: gunzip -c smm-latest.tar.gz | docker load

      - name: Require API key secrets for suites that need them
        if: matrix.artifact_prefix == 'docker-config' || matrix.artifact_prefix == 'docker-media-init'
        run: |
          missing=0
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::Secret TMDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${TVDB_API_KEY:-}" ]; then
            echo "::error::Secret TVDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          exit "$missing"

      - name: Run Docker E2E
        id: e2e
        run: |
          args=()
          for pattern in ${{ matrix.spec }}; do
            args+=(--spec "$pattern")
          done
          bun ci/run-e2e-test.ts --platform docker "${args[@]}"
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Scan e2e logs for secret leaks
        id: scan-secure
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload E2E logs and reports
        if: always() && steps.e2e.outcome != 'skipped' && steps.scan-secure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7

  e2e-docker-gate:
    name: docker-e2e / gate
    needs: [build-image, e2e-docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Docker E2E jobs passed
        run: |
          set -euo pipefail
          if [ "${{ needs.build-image.result }}" != "success" ]; then
            echo "::error::build-image: ${{ needs.build-image.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e-docker.result }}" != "success" ]; then
            echo "::error::e2e matrix: ${{ needs.e2e-docker.result }}"
            exit 1
          fi
          echo "All Docker E2E jobs passed."

  # ------------------------------------------------------------------
  # HTTP Proxy E2E (was e2e-http-proxy.yml)
  # ------------------------------------------------------------------
  e2e-http-proxy:
    name: HTTP Proxy (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [dispatch-build]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runs-on: ubuntu-latest
          - platform: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - platform: win
            arch: x64
            runs-on: windows-latest
          - platform: win
            arch: arm64
            runs-on: windows-11-arm
          - platform: mac
            arch: arm64
            runs-on: macos-14

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SMM_AUTH_TOKEN: ChangeMe123
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Run reverse-proxy HTTP Proxy tests
        id: e2e
        run: pnpm e2e:http-proxy

      - name: Scan e2e logs for secret leaks
        id: scan-secure
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload logs
        if: always() && steps.e2e.outcome != 'skipped' && steps.scan-secure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: http-proxy-${{ matrix.platform }}-${{ matrix.arch }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7

  e2e-http-proxy-gate:
    name: http-proxy-e2e / gate
    needs: [e2e-http-proxy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all HTTP Proxy E2E jobs passed
        run: |
          set -euo pipefail
          if [ "${{ needs.e2e-http-proxy.result }}" != "success" ]; then
            echo "::error::http-proxy matrix: ${{ needs.e2e-http-proxy.result }}"
            exit 1
          fi
          echo "All HTTP Proxy E2E jobs passed."
