name: Pre Release

# Manual orchestration: dispatch each "E2E Tests for XXX" workflow as its own
# workflow_dispatch run (visible on that workflow's Actions page), wait in
# parallel, then gate. Not a CI or release gate by itself — maintainers
# dispatch this to validate product surfaces (CLI / Electron / Web UI / MCP /
# AI Tools / Docker) on their platform matrices.
#
# Each suite still builds on its own runners (no shared artifacts).

run-name: "Pre Release «parent:${{ inputs.parent_run_id || 'manual' }}»"

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: 'Parent Actions run id when dispatched by an orchestrator (reuse correlation)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  e2e-cli:
    name: E2E Tests for CLI
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/dispatch-and-wait-workflow.sh e2e-cli.yml "${{ github.ref_name }}" "${{ github.sha }}"

  e2e-electron:
    name: E2E Tests for Electron
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/dispatch-and-wait-workflow.sh e2e-electron.yml "${{ github.ref_name }}" "${{ github.sha }}"

  e2e-web-ui:
    name: E2E Tests for Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/dispatch-and-wait-workflow.sh e2e-web-ui.yml "${{ github.ref_name }}" "${{ github.sha }}"

  e2e-docker:
    name: E2E Tests for Docker
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/dispatch-and-wait-workflow.sh e2e-docker.yml "${{ github.ref_name }}" "${{ github.sha }}"

  e2e-mcp-tools:
    name: E2E Tests for MCP Tools
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/dispatch-and-wait-workflow.sh e2e-mcp-tools.yml "${{ github.ref_name }}" "${{ github.sha }}"

  e2e-ai-tools:
    name: E2E Tests for AI Tools
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/dispatch-and-wait-workflow.sh e2e-ai-tools.yml "${{ github.ref_name }}" "${{ github.sha }}"

  gate:
    name: pre-release / gate
    needs:
      - e2e-cli
      - e2e-electron
      - e2e-web-ui
      - e2e-docker
      - e2e-mcp-tools
      - e2e-ai-tools
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all E2E suites passed
        env:
          CLI: ${{ needs.e2e-cli.result }}
          ELECTRON: ${{ needs.e2e-electron.result }}
          WEB_UI: ${{ needs.e2e-web-ui.result }}
          DOCKER: ${{ needs.e2e-docker.result }}
          MCP: ${{ needs.e2e-mcp-tools.result }}
          AI: ${{ needs.e2e-ai-tools.result }}
        run: |
          set -euo pipefail
          {
            echo "## Pre Release E2E"
            echo ""
            echo "| Suite | Result |"
            echo "|-------|--------|"
            echo "| CLI | ${CLI} |"
            echo "| Electron | ${ELECTRON} |"
            echo "| Web UI | ${WEB_UI} |"
            echo "| Docker | ${DOCKER} |"
            echo "| MCP Tools | ${MCP} |"
            echo "| AI Tools | ${AI} |"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Each suite is a separate workflow_dispatch run on its own Actions page."
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for name_result in \
            "CLI:${CLI}" \
            "Electron:${ELECTRON}" \
            "Web UI:${WEB_UI}" \
            "Docker:${DOCKER}" \
            "MCP Tools:${MCP}" \
            "AI Tools:${AI}"
          do
            name="${name_result%%:*}"
            result="${name_result#*:}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name}: ${result}"
              failed=1
            fi
          done
          exit "${failed}"
