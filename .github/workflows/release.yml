            apps/electron/dist/*.exe
            apps/electron/dist/*.dmg
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
          retention-days: 30

  release-electron:
    name: Create GitHub Release (Electron installers)
    needs:
      - ensure-tag
      - build-electron-linux-x64
      - build-electron-linux-arm64
      - build-electron-windows-x64
      - build-electron-windows-arm64
      - build-electron-mac-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download Electron artifacts (all platforms)
        if: ${{ !inputs.skip_final_publish }}
        uses: actions/download-artifact@v4
        with:
          pattern: smm-v*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release and upload assets (new tag)
        if: ${{ !inputs.skip_final_publish && needs.ensure-tag.outputs.tag_exists != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ (inputs.release_name != '' && inputs.release_name) || inputs.tag_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          body: ${{ inputs.body }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to existing GitHub Release
        if: ${{ !inputs.skip_final_publish && needs.ensure-tag.outputs.tag_exists == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(dist/**/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Electron artifacts found in dist/"
            exit 1
          fi
          gh release upload "${{ inputs.tag_name }}" "${files[@]}" --clobber
          echo "Uploaded Electron assets to existing Release ${{ inputs.tag_name }}."
