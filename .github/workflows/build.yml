name: Build

# Manual-only multi-platform build validation (same five OS/arch runners as
# "E2E Tests for Electron"). On each runner: unit tests, typecheck, knip
# (hard gate), then produce UI web assets, CLI binary, and Electron installers.
# Not a CI or release gate — maintainers dispatch this to verify packaging
# across platforms. Uploads artifacts for inspection (no GitHub Release).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runs-on: windows-latest
            build_command: build:win
          - platform: win
            arch: arm64
            runs-on: windows-11-arm
            build_command: build:win
          - platform: linux
            arch: x64
            runs-on: ubuntu-latest
            build_command: build:linux
          - platform: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
            build_command: build:linux
          - platform: mac
            arch: arm64
            runs-on: macos-14
            build_command: build:mac

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      # Skip Developer ID / code-signing discovery for validation builds.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Install electron dependencies
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm -r test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Knip
        run: pnpm knip

      - name: Download third-party binaries
        run: bash ci/download-3pp-binary.sh
        env:
          PLATFORM: ${{ env.PLATFORM }}
          ARCH: ${{ env.ARCH }}
          VIDEOCAPTIONER_VERSION: 1.0.0

      - name: Build CLI
        run: pnpm --filter cli run build

      - name: Build UI
        run: cd apps/ui && pnpm run build

      - name: Build Electron installers
        run: cd apps/electron && pnpm run ${{ matrix.build_command }} -- --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/ui/dist
            apps/cli/dist
            apps/electron/dist/*.exe
            apps/electron/dist/*.dmg
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
          if-no-files-found: error
          retention-days: 7
