name: E2E Tests for Electron

# Manual-only e2e against the unpacked SMM Electron binary.
# Runs the apps/e2e Electron suite scripts listed below. common/manual stays on-demand.
# Builds on the same runner that runs the tests. No unit tests, and not a CI or release gate.
#
# For host / docker / CLI e2e, use the CI workflow or "E2E Tests for CLI".

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platform-arch keys to run (win-x64,win-arm64,linux-x64,linux-arm64,mac-arm64). Empty = all.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests for Electron (${{ matrix.platform }}-${{ matrix.arch }})
    if: ${{ inputs.platforms == '' || contains(format(',{0},', inputs.platforms), format(',{0}-{1},', matrix.platform, matrix.arch)) || contains(format(',{0},', inputs.platforms), format(', {0}-{1},', matrix.platform, matrix.arch)) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runs-on: windows-latest
          - platform: win
            arch: arm64
            runs-on: windows-11-arm
          - platform: linux
            arch: x64
            runs-on: ubuntu-latest
          - platform: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - platform: mac
            arch: arm64
            runs-on: macos-14

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SMM_AUTH_TOKEN: ChangeMe123
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      # Skip Developer ID lookup. macOS ad-hoc signing happens after the unpack step.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Install electron dependencies
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Require API key secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::Secret TMDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${TVDB_API_KEY:-}" ]; then
            echo "::error::Secret TVDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          exit "$missing"

      - name: Download third-party binaries
        run: bash ci/download-3pp-binary.sh
        env:
          PLATFORM: ${{ env.PLATFORM }}
          ARCH: ${{ env.ARCH }}
          VIDEOCAPTIONER_VERSION: 1.0.0

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libgtk-3-0t64 \
            libgbm1 \
            libasound2t64 \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libdrm2 \
            libpango-1.0-0 \
            libcairo2 \
            libx11-xcb1 \
            libxshmfence1 \
            libnotify4 \
            libsecret-1-0 \
            libatspi2.0-0t64 \
            xdg-utils

      - name: Build cli
        run: pnpm --filter cli run build

      - name: Build ui
        run: cd apps/ui && pnpm run build

      - name: Build unpacked Electron binary
        run: cd apps/electron && pnpm run build && pnpm exec -- electron-builder --dir --"${ARCH}" --publish never

      - name: Resolve unpacked binary
        run: |
          set -euo pipefail
          dist="apps/electron/dist"
          case "${PLATFORM}" in
            win)
              if [ "${ARCH}" = "arm64" ]; then
                bin="${dist}/win-arm64-unpacked/SMM.exe"
              else
                bin="${dist}/win-unpacked/SMM.exe"
              fi
              ;;
            mac)
              app="${dist}/mac-arm64/SMM.app"
              bin="${app}/Contents/MacOS/SMM"
              ;;
            linux)
              if [ "${ARCH}" = "arm64" ]; then
                dir="${dist}/linux-arm64-unpacked"
              else
                dir="${dist}/linux-unpacked"
              fi
              if [ -f "${dir}/smm" ]; then
                bin="${dir}/smm"
              elif [ -f "${dir}/SMM" ]; then
                bin="${dir}/SMM"
              else
                bin=""
              fi
              ;;
            *)
              echo "::error::Unsupported PLATFORM ${PLATFORM}"
              exit 1
              ;;
          esac

          if [ -z "${bin}" ] || [ ! -e "${bin}" ]; then
            echo "::error::Unpacked SMM binary not found (PLATFORM=${PLATFORM} ARCH=${ARCH})"
            find "${dist}" -maxdepth 3 \( -type d -o -type f \) | head -n 80
            exit 1
          fi

          abs="$(cd "$(dirname "${bin}")" && pwd)/$(basename "${bin}")"
          if [ "${PLATFORM}" = "win" ]; then
            # Node on Windows does not understand Git bash /d/ paths.
            abs="$(cygpath -m "${abs}")"
          fi
          if [ "${PLATFORM}" = "mac" ]; then
            entitlements="apps/electron/build/entitlements.mac.plist"
            resources="$(cd "$(dirname "${abs}")/../Resources" && pwd)"
            # Bun's compiled CLI needs the hardened runtime plus JIT entitlements.
            # A bare ad-hoc signature lets macOS kill it (connection refused).
            if [ -f "${resources}/cli" ]; then
              codesign --force --sign - --options runtime --entitlements "${entitlements}" "${resources}/cli"
            fi
            codesign --force --sign - --entitlements "${entitlements}" "${abs}"
          fi

          echo "SMM_ELECTRON_BINARY=${abs}" >> "${GITHUB_ENV}"
          echo "SMM_ELECTRON_BINARY=${abs}"

      - name: Install Electron Chromedriver (linux-arm64)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          # Must match browserVersion in apps/e2e/electron/wdio.conf.ts.
          version=39.2.6
          url="https://github.com/electron/electron/releases/download/v${version}/chromedriver-v${version}-linux-arm64.zip"
          dest="${RUNNER_TEMP}/electron-chromedriver"
          mkdir -p "${dest}"
          curl -fsSL -L -o "${dest}/chromedriver.zip" "${url}"
          unzip -o "${dest}/chromedriver.zip" -d "${dest}"
          bin="$(find "${dest}" -type f -name chromedriver | head -n 1)"
          if [ -z "${bin}" ]; then
            echo "::error::chromedriver binary not found in Electron release zip"
            find "${dest}" -maxdepth 3
            exit 1
          fi
          chmod +x "${bin}"
          echo "CHROMEDRIVER=${bin}" >> "${GITHUB_ENV}"
          "${bin}" --version

      - name: Run Electron e2e
        id: e2e
        run: |
          set -euo pipefail
          if [ "${PLATFORM}" = "linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" bash -euo pipefail -c '
              cd apps/e2e
              pnpm e2e:config
              pnpm e2e:mcp
              pnpm e2e:movie
              pnpm e2e:music
              pnpm e2e:other
              pnpm e2e:tv
              pnpm e2e:tvdb
            '
          else
            cd apps/e2e
            pnpm e2e:config
            pnpm e2e:mcp
            pnpm e2e:movie
            pnpm e2e:music
            pnpm e2e:other
            pnpm e2e:tv
            pnpm e2e:tvdb
          fi

      - name: Scan e2e logs for secret leaks
        id: scan-secure
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload logs
        if: always() && steps.e2e.outcome != 'skipped' && steps.scan-secure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-${{ matrix.platform }}-${{ matrix.arch }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7
