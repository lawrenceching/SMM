name: E2E Tests for CLI

# Manual-only CLI bun:test e2e (apps/e2e/cli) against a freshly built apps/cli/dist/cli[.exe].
# Same five OS/arch runners as "E2E Tests for Electron": each matrix job builds CLI on the
# runner, then runs tests (no shared cli-dist artifact).
# CI still uses reusable _e2e-cli.yml after its own ubuntu build-cli job.

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional bun test path under apps/e2e/cli (e.g. ./cli/tmdb.test.ts). Empty runs all CLI e2e tests.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated platform-arch keys to run (win-x64,win-arm64,linux-x64,linux-arm64,mac-arm64). Empty = all.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.filter.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter platforms
        id: filter
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          include="$(
            python ci/filter-platform-matrix.py <<'EOF'
          [
            {"platform":"win","arch":"x64","runs-on":"windows-latest"},
            {"platform":"win","arch":"arm64","runs-on":"windows-11-arm"},
            {"platform":"linux","arch":"x64","runs-on":"ubuntu-latest"},
            {"platform":"linux","arch":"arm64","runs-on":"ubuntu-24.04-arm"},
            {"platform":"mac","arch":"arm64","runs-on":"macos-14"}
          ]
          EOF
          )"
          {
            echo "include<<EOF"
            echo "${include}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved matrix: ${include}"

  e2e:
    name: E2E Tests for CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [resolve-matrix]
    if: ${{ needs.resolve-matrix.outputs.include != '[]' }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}

    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      TMDB_HOST: https://api.themoviedb.org/3
      TVDB_HOST: https://api4.thetvdb.com/v4
      USE_EMBEDDED_HTTP_PROXY: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Require API key secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::Secret TMDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${TVDB_API_KEY:-}" ]; then
            echo "::error::Secret TVDB_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          exit "$missing"

      - name: Build CLI
        run: pnpm --filter cli run build

      - name: Run CLI E2E tests
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.test_filter }}" ]; then
            bun ci/run-cli-e2e-test.ts "${{ inputs.test_filter }}"
          else
            bun ci/run-cli-e2e-test.ts
          fi
