name: E2E Test

# Path filter: keep in sync with build.yml
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'ci/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build.yml'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/e2e-docker.yml'
      - '.github/workflows/e2e-http-proxy.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'ci/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build.yml'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/e2e-docker.yml'
      - '.github/workflows/e2e-http-proxy.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMM_AUTH_TOKEN: ChangeMe123
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run AI Tests
            spec: "./test/specs/ai/*.e2e.ts"
            artifact_prefix: ai
          - name: Run Config and HTTP Proxy Tests
            spec: "./common/config/*.e2e.ts ./common/httpproxy/*.e2e.ts"
            artifact_prefix: config-httpproxy
          - name: Run MCP Tests
            spec: "./common/mcp/*.e2e.ts"
            artifact_prefix: mcp
          - name: Run Common Media Init Tests
            spec: "./common/tv/ImportTvShowLibrary.e2e.ts ./common/tv/Initialize*.e2e.ts ./common/movie/ImportMovieLibrary.e2e.ts ./common/movie/Initialize*.e2e.ts"
            artifact_prefix: media-folder-initialization
          - name: Run Movie Tests
            spec: "./common/movie/SearchMovie.e2e.ts ./common/movie/Movie-RenameVideoFile.e2e.ts"
            artifact_prefix: movie
          - name: Run Music Tests
            spec: "./common/music/*.e2e.ts"
            artifact_prefix: music
          - name: Run Other Tests
            spec: "./common/other/*.e2e.ts"
            artifact_prefix: other
          - name: Run TV Show Tests
            spec: "./common/tv/SearchTvShow.e2e.ts ./common/tv/Scrape*.e2e.ts ./common/tv/TVShow-*.e2e.ts"
            artifact_prefix: tv
          - name: Run TVDB Tests
            spec: "./common/tvdb/*.e2e.ts"
            artifact_prefix: tvdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '146.0.7680.153'
          install-dependencies: true
          install-chromedriver: true

      - name: Run E2E tests
        id: e2e
        run: |
          args=()
          for pattern in ${{ matrix.spec }}; do
            args+=(--spec "$pattern")
          done
          bun ci/run-e2e-test.ts "${args[@]}"
        env:
          BUILD_ENV: docker
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Scan e2e logs for secret leaks
        id: scan-secure
        if: always() && steps.e2e.outcome != 'skipped'
        run: bun ci/scan_secure_data.ts --dir artifacts/cicd

      - name: Upload E2E logs and reports
        if: always() && steps.e2e.outcome != 'skipped' && steps.scan-secure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-logs-${{ github.run_id }}
          path: artifacts/cicd/
          if-no-files-found: ignore
          retention-days: 7

  e2e-gate:
    name: host-e2e / gate
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all host E2E jobs passed
        run: |
          set -euo pipefail
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::e2e matrix: ${{ needs.e2e.result }}"
            exit 1
          fi
          echo "All host E2E jobs passed."
