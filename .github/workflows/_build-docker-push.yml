name: Build and push Docker image (reusable)

on:
  workflow_call:
    inputs:
      semver_tag:
        description: 'Optional semver tag for lawrenceching/smm (e.g. v1.2.3)'
        required: false
        type: string
        default: ''
      push_release_image:
        description: 'Push the final lawrenceching/smm release image (false when an orchestrator publishes)'
        required: false
        type: boolean
        default: true
      force_rebuild_3pp:
        description: 'Rebuild ffmpeg/ytdlp/videocaptioner images even if their version tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# The 3pp images (ffmpeg / yt-dlp / videocaptioner) are tagged by their own
# software version (see root package.json "3pp"); each job reuses the image when
# that tag already exists in GHCR instead of re-downloading external binaries.
# cli/ui are app code and are rebuilt every commit (tagged by SHA) in the
# assemble job below.
jobs:
  build-ffmpeg:
    name: Build ffmpeg Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image coordinates
        id: meta
        env:
          OWNER_LC: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: bash ci/docker-image-coords.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or reuse smm-ffmpeg image
        env:
          PLATFORMS: linux/amd64,linux/arm64
          IMAGE: ${{ steps.meta.outputs.ffmpeg_image }}
          FORCE_REBUILD: ${{ inputs.force_rebuild_3pp }}
        run: |
          set -euo pipefail
          if [ "${FORCE_REBUILD}" = "true" ] || ! docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Building ${IMAGE}"
            docker buildx build --platform "$PLATFORMS" --push \
              -t "${IMAGE}" -f apps/docker/ffmpeg.Dockerfile .
          else
            echo "Image ${IMAGE} already exists; skipping build."
          fi

  build-ytdlp:
    name: Build ytdlp Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image coordinates
        id: meta
        env:
          OWNER_LC: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: bash ci/docker-image-coords.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or reuse smm-ytdlp image
        env:
          PLATFORMS: linux/amd64,linux/arm64
          IMAGE: ${{ steps.meta.outputs.ytdlp_image }}
          FORCE_REBUILD: ${{ inputs.force_rebuild_3pp }}
        run: |
          set -euo pipefail
          if [ "${FORCE_REBUILD}" = "true" ] || ! docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Building ${IMAGE}"
            docker buildx build --platform "$PLATFORMS" --push \
              -t "${IMAGE}" -f apps/docker/ytdlp.Dockerfile .
          else
            echo "Image ${IMAGE} already exists; skipping build."
          fi

  build-videocaptioner:
    name: Build videocaptioner Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image coordinates
        id: meta
        env:
          OWNER_LC: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: bash ci/docker-image-coords.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or reuse smm-videocaptioner image
        env:
          PLATFORMS: linux/amd64,linux/arm64
          IMAGE: ${{ steps.meta.outputs.videocaptioner_image }}
          VC_VERSION: ${{ steps.meta.outputs.videocaptioner_version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild_3pp }}
        run: |
          set -euo pipefail
          if [ "${FORCE_REBUILD}" = "true" ] || ! docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Building ${IMAGE}"
            docker buildx build --platform "$PLATFORMS" --push \
              --build-arg "VIDEOCAPTIONER_VERSION=${VC_VERSION}" \
              -t "${IMAGE}" -f apps/docker/videocaptioner.Dockerfile .
          else
            echo "Image ${IMAGE} already exists; skipping build."
          fi

  build-and-push:
    name: Build and push lawrenceching/smm
    needs: [build-ffmpeg, build-ytdlp, build-videocaptioner]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image coordinates
        id: meta
        env:
          OWNER_LC: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: bash ci/docker-image-coords.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cli/ui intermediate images
        env:
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          docker buildx build --platform "$PLATFORMS" --push \
            -t "${{ steps.meta.outputs.cli_image }}" \
            -f apps/docker/cli.Dockerfile .
          docker buildx build --platform "$PLATFORMS" --push \
            -t "${{ steps.meta.outputs.ui_image }}" \
            -f apps/docker/ui.Dockerfile .

      - name: Assemble and push lawrenceching/smm
        if: inputs.push_release_image
        env:
          PLATFORMS: linux/amd64,linux/arm64
          SEMVER_TAG: ${{ inputs.semver_tag }}
        run: |
          set -euo pipefail
          tags=(
            -t "lawrenceching/smm:latest"
            -t "lawrenceching/smm:${{ steps.meta.outputs.sha }}"
          )
          if [ -n "${SEMVER_TAG}" ]; then
            tags+=( -t "lawrenceching/smm:${SEMVER_TAG}" )
          fi
          docker buildx build --platform "$PLATFORMS" --push \
            --build-arg "SMM_CLI_IMAGE=${{ steps.meta.outputs.cli_image }}" \
            --build-arg "SMM_UI_IMAGE=${{ steps.meta.outputs.ui_image }}" \
            --build-arg "SMM_FFMPEG_IMAGE=${{ steps.meta.outputs.ffmpeg_image }}" \
            --build-arg "SMM_YTDLP_IMAGE=${{ steps.meta.outputs.ytdlp_image }}" \
            --build-arg "SMM_VIDEOCAPTIONER_IMAGE=${{ steps.meta.outputs.videocaptioner_image }}" \
            "${tags[@]}" \
            -f apps/docker/Dockerfile .
